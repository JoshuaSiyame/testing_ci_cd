name: DigitalPolicy CI/CD Workflow

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, curl, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy (local path on runner machine)
        shell: bash
        run: |
          set -e
          cd "$HOME/TestingCICD/testing_ci_cd"

          git fetch origin master
          git reset --hard origin/master

          # composer update --no-dev --prefer-dist --no-interaction --optimize-autoloader

          # php artisan config:clear
          # php artisan cache:clear
          # php artisan config:cache
          # php artisan route:cache
          # php artisan view:cache